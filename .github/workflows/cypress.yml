name: E2E Tests - Cypress + Cucumber

on:
  push:
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes E2E (Cypress + Cucumber)
        run: npx cypress run --e2e --browser chrome
        env:
          K6_EMAIL: ${{ secrets.K6_EMAIL }}
          K6_PASSWORD: ${{ secrets.K6_PASSWORD }}

      - name: Upload de relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-relatorios
          path: |
            cypress/results
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 14